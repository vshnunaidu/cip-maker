name: Keep Supabase Active

on:
  schedule:
    # Run every 6 days at 3am UTC (before 7-day pause threshold)
    - cron: '0 3 */6 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase to prevent auto-pause
        run: |
          curl -f "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/plan_settings?select=id" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          echo "✓ Database pinged successfully - will stay active"
